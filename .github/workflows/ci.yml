name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check commit messages and branch name
        # Dependabot writes its own commit messages with long release notes.
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          node scripts/git-workflow.ts "$BASE" "$HEAD" "$BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the production build
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/check-site.ts http://localhost:3000 | tee report.md
          exit ${PIPESTATUS[0]}

      - name: Add the report to the job summary
        if: always()
        run: test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || true

      # The server from the step above keeps running for this step.
      - name: Run Lighthouse on the production build
        run: |
          node scripts/check-lighthouse.ts http://localhost:3000 | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}

      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-report
          path: lighthouse.report.html
          if-no-files-found: ignore
